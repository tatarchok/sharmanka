<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Sharmanka Mini Player</title>
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div class="overlay-player" id="overlay-player">
    <div class="overlay-art-wrap" id="overlay-art-wrap">
      <img id="overlay-art-img" alt="" />
      <svg id="overlay-art-placeholder" xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
        <path d="M400-120q-66 0-113-47t-47-113q0-66 47-113t113-47q23 0 42.5 5.5T480-418v-422h240v160H560v400q0 66-47 113t-113 47Z"/>
      </svg>
    </div>
    <div class="overlay-info">
      <span class="overlay-title" id="overlay-title">Sharmanka</span>
      <span class="overlay-artist" id="overlay-artist">Ничего не играет</span>
    </div>
    <div class="overlay-controls">
      <button class="overlay-btn" id="overlay-prev" title="Предыдущий трек">
        <svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px" fill="currentColor"><path d="M220-240v-480h80v480h-80Zm520 0L380-480l360-240v480Z"/></svg>
      </button>
      <button class="overlay-btn overlay-btn-play" id="overlay-play" title="Воспроизведение">
        <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="16px" fill="currentColor"><path d="M320-200v-560l440 280-440 280Z"/></svg>
      </button>
      <button class="overlay-btn" id="overlay-next" title="Следующий трек">
        <svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px" fill="currentColor"><path d="M660-240v-480h80v480h-80ZM220-240v-480l360 240-360 240Z"/></svg>
      </button>
    </div>
  </div>
  <script src="js/overlay.js"></script>
</body>
</html>
